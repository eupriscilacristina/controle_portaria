<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Solicitar visita · Portaria</title>
  <link rel="icon" href="TEKNER_marca.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=70">
  <link rel="stylesheet" href="css/visitas.css?v=1">
</head>

<body>
  <div class="bg-tech" aria-hidden="true"></div>
  <main class="container vis-root" style="max-width: 520px;">
    <section class="card" id="pubCard">
      <div class="card-head">
        <h2>Solicitar visita</h2>
        <p>Informe o apartamento e o PIN de 6 dígitos do morador. A portaria confirma a sua visita.</p>
      </div>
      <div class="vis-status" id="pubAviso" role="alert" hidden></div>
      <form id="pubForm" class="form-grid" autocomplete="off">
        <div class="field">
          <label for="pubBloco">Bloco</label>
          <input id="pubBloco" maxlength="20" placeholder="Ex.: A (se houver)" autocapitalize="characters">
        </div>
        <div class="field">
          <label for="pubApto">Apartamento *</label>
          <input id="pubApto" maxlength="20" required inputmode="numeric" placeholder="Ex.: 101">
        </div>
        <div class="field full">
          <label for="pubPin">PIN do morador (6 dígitos) *</label>
          <input id="pubPin" maxlength="6" required inputmode="numeric" pattern="\d{6}" autocomplete="off"
            placeholder="******">
        </div>
        <div class="field full">
          <label for="pubNome">Seu nome *</label>
          <input id="pubNome" maxlength="120" required placeholder="Nome completo do visitante">
        </div>
        <div class="field full">
          <label for="pubDoc">Documento</label>
          <input id="pubDoc" maxlength="30" placeholder="RG ou CPF (opcional)">
        </div>
        <div class="field">
          <label for="pubData">Data *</label>
          <input id="pubData" type="date" required>
        </div>
        <div class="field">
          <label for="pubIni">Das *</label>
          <input id="pubIni" type="time" required>
        </div>
        <div class="field">
          <label for="pubFim">Até *</label>
          <input id="pubFim" type="time" required>
        </div>
        <div class="field full">
          <label for="pubObs">Observação</label>
          <input id="pubObs" maxlength="300" placeholder="Opcional">
        </div>
        <div class="field full vis-actions">
          <button type="submit" class="btn primary lg" id="pubEnviar">Enviar solicitação</button>
        </div>
      </form>
    </section>

    <section class="card" id="pubSucesso" hidden>
      <div class="vis-resultado ok">
        <h2>Solicitação enviada</h2>
        <p>Aguarde a aprovação da portaria. Você receberá o QR de acesso quando for aprovado.</p>
        <p class="vis-hint" id="pubProtocolo"></p>
      </div>
    </section>
  </main>

  <script src="js/visita-publica.js?v=1"></script>
</body>

</html>
